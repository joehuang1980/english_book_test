<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>成語闖關王｜臺南市國小成語題庫</title>
<style>
:root{--bg:#f6f1e8;--card:#fffdf8;--ink:#273043;--muted:#667085;--accent:#f59e0b;--accent2:#0f766e;--ok:#15803d;--bad:#b42318;--line:#d7d1c7;--shadow:0 10px 30px rgba(39,48,67,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff7e7,#eef7f4);touch-action:manipulation} button{font:inherit;color:inherit} .app{max-width:1100px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))} header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px} .brand{font-weight:900;font-size:clamp(22px,4vw,34px)} .pill{background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-weight:700} .card{background:rgba(255,253,248,.96);border:1px solid #e8e0d4;border-radius:24px;box-shadow:var(--shadow);padding:clamp(18px,3vw,30px)} h1,h2,h3,p{margin-top:0} .home h1{font-size:clamp(30px,6vw,52px);margin-bottom:8px} .lead{font-size:18px;color:var(--muted);line-height:1.7} .group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:22px} .group-btn,.bigbtn,.option,.match-btn{border:0;border-radius:18px;background:white;box-shadow:0 3px 12px rgba(39,48,67,.1);padding:16px;min-height:58px;cursor:pointer;font-weight:800} .group-btn.done{background:#e9f8ef;color:#166534} .group-btn.current{outline:3px solid #fbbf24} .bigbtn{background:var(--accent2);color:white;padding:14px 22px} .secondary{background:#fff;color:var(--ink);border:1px solid var(--line)} .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap} .progress{height:12px;background:#ece8df;border-radius:99px;overflow:hidden;margin:12px 0 22px} .progress>div{height:100%;background:linear-gradient(90deg,#f59e0b,#0f766e);transition:width .25s} .instruction{font-size:17px;color:var(--muted);line-height:1.6} .match-wrap{display:grid;grid-template-columns:1fr 1.65fr;gap:18px;position:relative} .match-col{display:flex;flex-direction:column;gap:12px} .match-btn{text-align:left;line-height:1.45;position:relative;border:2px solid transparent} .match-btn.idiom{font-size:22px;text-align:center} .match-btn.selected{border-color:#f59e0b;background:#fff7dd} .match-btn.matched{background:#e8f7ed;color:#166534;opacity:.75} .definition{font-size:clamp(19px,3.2vw,28px);line-height:1.7;background:#fff7e7;padding:22px;border-radius:18px;margin:18px 0} .options{display:grid;grid-template-columns:1fr 1fr;gap:14px} .option{font-size:clamp(20px,3vw,26px);min-height:76px} .option.correct{background:#dcfce7;color:#166534} .option.wrong{background:#fee2e2;color:#991b1b} .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:620px;margin:18px auto} .tile{aspect-ratio:1;border:0;border-radius:16px;background:white;box-shadow:0 3px 12px rgba(39,48,67,.13);font-size:clamp(27px,6vw,46px);font-weight:900;cursor:pointer} .tile.sel{background:#fff0bd;outline:3px solid #f59e0b} .tile.solved{background:#e7f7ec;color:#166534} .tile.bad{animation:shake .25s;background:#fee2e2} @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}} .answerline{height:54px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:28px;font-weight:900;letter-spacing:.15em} .feedback{min-height:30px;text-align:center;font-weight:800;margin:12px 0} .ok{color:var(--ok)} .badtext{color:var(--bad)} .stage-badge{font-weight:900;color:#0f766e} .scorebox{display:flex;gap:10px;flex-wrap:wrap} .modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5} .modal .card{max-width:560px;text-align:center} .hidden{display:none!important} .stars{font-size:42px;letter-spacing:8px} .tiny{font-size:14px;color:var(--muted)} @media(max-width:720px){.match-wrap{grid-template-columns:1fr} .match-btn.idiom{font-size:20px} .options{grid-template-columns:1fr} .card{border-radius:18px;padding:16px} .grid5{gap:7px} .tile{border-radius:12px}} @media(orientation:landscape) and (max-height:600px){.app{padding-top:8px} header{margin-bottom:6px} .definition{padding:12px;margin:8px 0;font-size:18px} .grid5{max-width:430px;gap:6px;margin:8px auto} .tile{font-size:30px}}

/* 學習紀錄與教師模式 */
.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.datebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;padding:12px 14px;border:1px solid var(--line);border-radius:16px}.datebox input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.record-table{width:100%;border-collapse:collapse;font-size:15px}.record-table th,.record-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.record-table th{background:#f8f5ef;position:sticky;top:0}.table-wrap{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:14px}.wrong-list{display:grid;gap:10px;margin:14px 0}.wrong-item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#f2f4f7;margin:2px}.tag.badtag{background:#fee2e2;color:#991b1b}.tag.oktag{background:#dcfce7;color:#166534}.review-count{font-size:20px;font-weight:900}.danger{background:#fff;color:#991b1b;border:1px solid #fecaca}.teacher-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px;margin-top:4px}@media(max-width:720px){.record-table{font-size:13px}.record-table th,.record-table td{padding:8px 6px}}
</style></head><body><div class="app"><header><div class="brand">🏯 成語闖關王</div><div id="headerInfo" class="pill">200 題</div></header><main id="main"></main></div><div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
<script>
const BANK=[{"no": 1, "group": "第 1 組", "idiom": "口若懸河", "definition": "形容人說起話來像瀑布一樣滔滔不絕，比喻人能言善辯。與「笨口拙舌、張口結舌、期期艾艾」相反。"}, {"no": 2, "group": "第 1 組", "idiom": "探囊取物", "definition": "伸手到袋子裡拿取東西。比喻事情極容易辦到。也作「囊中取物」。"}, {"no": 3, "group": "第 1 組", "idiom": "守株待兔", "definition": "沿用過去的方法，守在樹旁，等待撞樹而死的兔子，最後終一無所得。比喻拘泥守成。後亦用「守株待兔」比喻妄想不勞而獲或等著目標自己送上門來。"}, {"no": 4, "group": "第 1 組", "idiom": "明察秋毫", "definition": "目光敏銳，可看見秋天鳥獸新長的毫毛。後用「明察秋毫」比喻洞察一切，能看到極細微的地方。（秋毫：鳥獸在秋天新長的細毛。後用以比喻細微的事物。)"}, {"no": 5, "group": "第 1 組", "idiom": "投桃報李", "definition": "比喻朋友之間友情深重，禮尚往來。"}, {"no": 6, "group": "第 1 組", "idiom": "防微杜漸", "definition": "微，隱微。杜，堵塞、阻絕。漸，逐漸擴大。在錯誤或壞事萌芽的時候及時制止，杜絕它發展。意指謹慎地防止事物的惡化。"}, {"no": 7, "group": "第 1 組", "idiom": "宜室宜家", "definition": "指女子有婦德，能使家庭和樂，夫婦和諧。"}, {"no": 8, "group": "第 1 組", "idiom": "謙沖自牧", "definition": "指人謙虛不自滿。（牧，養）"}, {"no": 9, "group": "第 1 組", "idiom": "一言九鼎", "definition": "形容說話具有決定性的作用。（鼎，古代國家的寶器）"}, {"no": 10, "group": "第 1 組", "idiom": "鴻鵠之志", "definition": "鴻鵠，天鵝，善高飛；形容遠大的志向，與「燕雀之志」相反。"}, {"no": 11, "group": "第 2 組", "idiom": "疾風勁草", "definition": "喻遭遇危難，才知其節操的堅貞。"}, {"no": 12, "group": "第 2 組", "idiom": "矯揉造作", "definition": "刻意的人工施為與雕琢。後亦用「矯揉造作」形容裝腔作勢、刻意做作的態度。義近「裝腔作勢」、「裝模作樣」。"}, {"no": 13, "group": "第 2 組", "idiom": "孜孜不倦", "definition": "指勤勉而不知疲倦。也作「孳ㄗ孳不倦」。(孜孜，勤勉不懈。)"}, {"no": 14, "group": "第 2 組", "idiom": "伯樂相馬", "definition": "比喻善於發現、選拔人才。（伯樂，本名孫陽，春秋秦穆公時人，以善於觀察馬著稱）"}, {"no": 15, "group": "第 2 組", "idiom": "沉魚落雁", "definition": "形容女子容貌美麗出眾。（「閉月羞花」、「國色天香」、「傾國傾城」皆可形容美人）"}, {"no": 16, "group": "第 2 組", "idiom": "吳下阿蒙", "definition": "用以譏諷人沒有才學。（阿蒙，三國時吳國大將呂蒙）"}, {"no": 17, "group": "第 2 組", "idiom": "高瞻遠矚", "definition": "形容人眼光遠大。（瞻，遠望；矚，注視）"}, {"no": 18, "group": "第 2 組", "idiom": "光風霽月", "definition": "用雨過天晴時的清風明月，比喻人坦蕩高尚的胸懷品格。（光風，雨後初晴時的和風；霽，指雨雪初晴）"}, {"no": 19, "group": "第 2 組", "idiom": "口碑載道", "definition": "眾人稱頌的話語，就像刻在記功碑上一樣，到處流傳。比喻廣受好評。同「有口皆碑」"}, {"no": 20, "group": "第 2 組", "idiom": "江郎才盡", "definition": "南朝文學家江淹，少有文名，晚年文思漸衰。比喻才情文思的減退。"}, {"no": 21, "group": "第 3 組", "idiom": "行雲流水", "definition": "比喻文章非常自然，毫不呆板。"}, {"no": 22, "group": "第 3 組", "idiom": "行不由徑", "definition": "走路不走小路。比喻人行事光明正大，心胸坦蕩磊落。"}, {"no": 23, "group": "第 3 組", "idiom": "文過飾非", "definition": "文：掩飾。飾：遮掩、偽裝。掩飾過失、錯誤。"}, {"no": 24, "group": "第 3 組", "idiom": "童叟無欺", "definition": "童意為「小孩」、叟意為「老人」，對待小孩和老人的態度一樣，不會欺瞞。比喻商店買賣誠實有信用。"}, {"no": 25, "group": "第 3 組", "idiom": "千里鵝毛", "definition": "喻禮物雖輕但情意甚重。（鵝毛，指物品微薄）"}, {"no": 26, "group": "第 3 組", "idiom": "鍥而不捨", "definition": "比喻做事持之以恆，堅持不懈。（鍥，雕刻；捨，停止）"}, {"no": 27, "group": "第 3 組", "idiom": "一暴十寒", "definition": "在陽光下曝晒一天，又接連冷凍十天。比喻人做事缺乏恆心，時常中斷(暴，同「曝」，曝晒)。"}, {"no": 28, "group": "第 3 組", "idiom": "滴水穿石", "definition": "滴水久了可使石穿。比喻持之以恆，事必有成。後亦用「水滴石穿」比喻小問題日積月累也會成為大問題。義近「有志竟成」，與「半途而廢」義反。"}, {"no": 29, "group": "第 3 組", "idiom": "寸草春暉", "definition": "比喻父母養育恩情的深重，兒女竭盡心力亦難以回報。（寸草，一寸長的小草，指兒女；春暉，春天溫暖的陽光，指父母對兒女細心的呵護與教養）"}, {"no": 30, "group": "第 3 組", "idiom": "金蘭之交", "definition": "形容朋友交情的契合。（金，用以比喻其堅；蘭，比喻其香。）與「莫逆之交」、「金石之交」義近。"}, {"no": 31, "group": "第 4 組", "idiom": "鏡花水月", "definition": "鏡中的影像，水裡的月亮。比喻虛幻不實在。同「鏡像水月」。"}, {"no": 32, "group": "第 4 組", "idiom": "讓棗推梨", "definition": "南朝梁 王泰讓棗，後漢 孔融推梨。用以稱讚兄弟之間友愛。與「兄友弟恭」義近。"}, {"no": 33, "group": "第 4 組", "idiom": "駑馬十駕", "definition": "駑，劣馬；駕，指馬車一天的行程為一駕。句謂良馬一天能跑千里之遙；劣馬雖慢，只要堅持不懈，也能跑很遠的路程。比喻平庸的人只要勤奮做事，也能有所成就。同「跬ㄎㄨㄟˇ步千里」、「勤能補拙」。"}, {"no": 34, "group": "第 4 組", "idiom": "汲汲營營", "definition": "汲汲，勤求不息；營營，追逐求取。形容人急切地奔馳追逐，以求取功名利祿。"}, {"no": 35, "group": "第 4 組", "idiom": "一片冰心", "definition": "又作「冰心玉壺」。冰心，心如冰般純潔清明。比喻人不慕名利，心境高潔。"}, {"no": 36, "group": "第 4 組", "idiom": "蕙質蘭心", "definition": "又作「蘭質蕙心」。蘭、蕙，皆香草；心靈如蕙，品質如蘭。比喻女子心性聰慧高雅。"}, {"no": 37, "group": "第 4 組", "idiom": "焚琴煮鶴", "definition": "把琴當柴燒，烹煮鶴來吃。比喻極殺風景的事。"}, {"no": 38, "group": "第 4 組", "idiom": "班門弄斧", "definition": "班，魯班，古代春秋魯國巧匠；弄，耍弄。「班門弄斧」指在巧匠魯班門前耍弄大斧。比喻在行家面前賣弄本事，不自量力。與「量力而行、深藏不露」相反。"}, {"no": 39, "group": "第 4 組", "idiom": "不世之材", "definition": "不世，世上少有的，非常的。形容當世少有，極出色的人材；是推崇讚譽之詞。同「蓋世之才」（註：蓋世，超過、高出當代之上）。"}, {"no": 40, "group": "第 4 組", "idiom": "劍及履及", "definition": "履，鞋子，做腳步解。及，到達。比喻奮起速行，指辦事效率極高。"}, {"no": 41, "group": "第 5 組", "idiom": "運籌帷幄", "definition": "運籌，籌謀策劃；帷幄，古時軍中帳幕。泛指善於策劃或指揮，也用以比喻居幕後策劃。"}, {"no": 42, "group": "第 5 組", "idiom": "一字千金", "definition": "一個字價值千兩黃金；形容文字價值很高。"}, {"no": 43, "group": "第 5 組", "idiom": "伯仲之間", "definition": "比喻彼此的能力不相上下。（古代兄弟排行：伯仲叔季。以伯仲比喻差距小。）與「一時瑜亮」、「不分軒輊」、「工力悉敵」、「並駕齊驅」意思相當。"}, {"no": 44, "group": "第 5 組", "idiom": "披星戴月", "definition": "形容早出晚歸地辛勤工作。"}, {"no": 45, "group": "第 5 組", "idiom": "臨深履薄", "definition": "形容謹慎小心。（詩經：「戰戰兢兢，如臨深淵，如履薄冰」）"}, {"no": 46, "group": "第 5 組", "idiom": "眾口鑠金", "definition": "形容輿論力量極大，可以顛倒黑白，混淆是非。（註：鑠，熔化；金，泛指金屬）"}, {"no": 47, "group": "第 5 組", "idiom": "好整以暇", "definition": "形容人喜愛嚴整而又能從容不迫（註：整，使齊一、有秩序；以，而）；今多用在紛亂、繁忙中顯得從容不迫的樣子。"}, {"no": 48, "group": "第 5 組", "idiom": "不亢不卑", "definition": "不高傲也不自卑。（亢：高。）"}, {"no": 49, "group": "第 5 組", "idiom": "曲突徙薪", "definition": "突，煙囪；彎曲煙囪，移開木材。比喻在禍患未發生前，先採取防範措施，則災禍不會發生。同「防患未然」、「未雨綢繆」。"}, {"no": 50, "group": "第 5 組", "idiom": "發憤忘食", "definition": "專心學習或工作以致忘記吃飯，形容十分勤奮。"}, {"no": 51, "group": "第 6 組", "idiom": "臨渴掘井", "definition": "不早作準備，事到臨頭才想辦法。"}, {"no": 52, "group": "第 6 組", "idiom": "按部就班", "definition": "部，類別；班，次序。原指寫文章時選取適當義理，加以編排順序。後指做事按照部署ㄕㄨˋ，依次進行。也可指依照老規矩辦事。"}, {"no": 53, "group": "第 6 組", "idiom": "指鹿為馬", "definition": "明明是鹿卻說是馬。比喻公然歪曲事實。"}, {"no": 54, "group": "第 6 組", "idiom": "臨淵羨魚", "definition": "比喻只作空想，難收實效。（羨，希望得到。）"}, {"no": 55, "group": "第 6 組", "idiom": "美輪美奐", "definition": "輪：高大的樣子。奐：文彩鮮明的樣子。形容房屋規模高大、裝飾華美。"}, {"no": 56, "group": "第 6 組", "idiom": "庖丁解牛", "definition": "梁惠王時有位廚師庖丁善宰牛，且技巧極為熟練。典出《莊子˙養生主》。後比喻對事物瞭解透澈，做事能得心應手，運用自如。與「游刃有餘」、「遊刃有餘」義近。"}, {"no": 57, "group": "第 6 組", "idiom": "見賢思齊", "definition": "看到賢能的人，便想效法他。《論語.里仁》：「見賢思齊焉，見不賢而內自省也。」《晉.常璩.華陽國志.卷四.南中志》：「知足下追踵古人，見賢思齊。」亦作「見德思齊」。"}, {"no": 58, "group": "第 6 組", "idiom": "譁眾取寵", "definition": "指用浮誇的言行以取悅大眾。"}, {"no": 59, "group": "第 6 組", "idiom": "張冠李戴", "definition": "弄錯了對象或弄錯了事實。"}, {"no": 60, "group": "第 6 組", "idiom": "削足適履", "definition": "削短腳趾來配合鞋子的大小。形容勉強求合，生搬硬套，而不顧及實際狀況。"}, {"no": 61, "group": "第 7 組", "idiom": "前倨後恭", "definition": "倨，傲慢；先前態度傲慢，後又轉為恭敬。用以譏笑勢利的人前後態度不一。"}, {"no": 62, "group": "第 7 組", "idiom": "暴殄天物", "definition": "暴，損害、糟蹋；殄，滅絕；天物，指鳥獸草木等自然界生物。殘殺滅絕自然界的生物；後泛指對物品不知愛惜，任意糟蹋。"}, {"no": 63, "group": "第 7 組", "idiom": "沽名釣譽", "definition": "指人矯情造作，用手段獵取名聲或讚譽。沽，買；釣，用餌引魚上鉤。"}, {"no": 64, "group": "第 7 組", "idiom": "提綱挈領", "definition": "綱，魚網上的總繩；挈，提起。全句是說「提起魚網的總繩，提起衣服的領子。」比喻抓住事理的重點。"}, {"no": 65, "group": "第 7 組", "idiom": "緣木求魚", "definition": "緣，動詞，順著東西往上爬。比喻方法、方向錯誤，根本不可能達到目的，徒勞無功而已。"}, {"no": 66, "group": "第 7 組", "idiom": "南橘北枳", "definition": "比喻生長環境的好壞影響本質的優劣。（枳，似橘而小，果實味道不同；橘生長在淮南就叫做橘子，生長在淮北就是枳。）相關語詞：「逾淮為枳」、「橘化為枳」。"}, {"no": 67, "group": "第 7 組", "idiom": "櫛風沐雨", "definition": "櫛，梳理頭髮；沐，洗頭；以風梳髮，以雨洗頭；形容不避風雨，奔波勞頓。"}, {"no": 68, "group": "第 7 組", "idiom": "甘之如飴", "definition": "比喻樂於承擔艱苦的事情。（飴，糖）"}, {"no": 69, "group": "第 7 組", "idiom": "固若金湯", "definition": "比喻防守嚴密，無懈可擊。義近「金城湯池」。"}, {"no": 70, "group": "第 7 組", "idiom": "甚囂塵上", "definition": "喧譁嘈雜，塵沙飛揚，原指軍隊作戰前的準備情況。後用「甚囂塵上」形容傳聞四起，議論紛紛；或指極為猖狂、囂張。"}, {"no": 71, "group": "第 8 組", "idiom": "臥薪嘗膽", "definition": "越王句踐躺臥在柴薪上，不時舔嘗苦膽，以警惕自己不忘所受的屈辱。比喻刻苦自勵，發奮圖強。與「醉生夢死」、「苟且偷生」義反。"}, {"no": 72, "group": "第 8 組", "idiom": "水到渠成", "definition": "水流到的地方，自然會形成溝渠。比喻事情條件齊全，自然成功，不必強求。「瓜熟蒂落」同義。"}, {"no": 73, "group": "第 8 組", "idiom": "倒行逆施", "definition": "比喻不按照情理行事。後用「倒行逆施」比喻胡作非為的罪惡行徑。"}, {"no": 74, "group": "第 8 組", "idiom": "不忮不求", "definition": "忮，嫉妒。指不嫉妒，不貪得。後來多用來形容淡泊無求，不做非分之事的處世態度。"}, {"no": 75, "group": "第 8 組", "idiom": "一鼓作氣", "definition": "意指作戰時擊第一通鼓，戰士們最能鼓足勇氣。後比喻做事時要趁著剛開始時的勇氣去做才容易成功。與「打鐵趁熱、一氣呵成」相似。"}, {"no": 76, "group": "第 8 組", "idiom": "字字珠璣", "definition": "珠璣，比喻優美的文章或詞句。形容句子或文章中遣詞用字非常優美。"}, {"no": 77, "group": "第 8 組", "idiom": "披肝瀝膽", "definition": "把肝膽都拿出來。比喻做人極為真誠坦白。（瀝，作「披露」、「表陳」解）"}, {"no": 78, "group": "第 8 組", "idiom": "明哲保身", "definition": "形容人能迴避禍患，保全己身。（明，明於理；哲，察於事）"}, {"no": 79, "group": "第 8 組", "idiom": "洞燭先機", "definition": "表示能清楚地預見事情先兆。（洞，副詞，透徹地；燭，動詞，照見）意同「洞燭幽微」。"}, {"no": 80, "group": "第 8 組", "idiom": "趨之若鶩", "definition": "趨附於他的人像成群的野鴨一樣，比喻眾人爭相追逐某項事物。多用於貶義。（鶩，野鴨）"}, {"no": 81, "group": "第 9 組", "idiom": "蜚短流長", "definition": "蜚，通「飛」。指無中生有，造謠生事。"}, {"no": 82, "group": "第 9 組", "idiom": "斬釘截鐵", "definition": "形容說話辦事堅決果斷，毫不猶豫。"}, {"no": 83, "group": "第 9 組", "idiom": "自怨自艾", "definition": "艾，割草，比喻改正；原指悔恨自己的錯誤，自己改正。現在多指自責悔嘆。"}, {"no": 84, "group": "第 9 組", "idiom": "大快朵頤", "definition": "朵，動。頤，下巴。朵頤，指動著腮頰欲食的樣子。指飽食愉快的樣子。與「大飽口福」相似。"}, {"no": 85, "group": "第 9 組", "idiom": "生意盎然", "definition": "形容充滿生命氣息，生命力旺盛。"}, {"no": 86, "group": "第 9 組", "idiom": "魚雁往返", "definition": "魚雁皆指書信。用來比喻書信往來。"}, {"no": 87, "group": "第 9 組", "idiom": "頤指氣使", "definition": "頤，下巴；頤指，不說話而用臉部表情示意；氣使，用神情去指揮別人。形容對別人態度傲慢。"}, {"no": 88, "group": "第 9 組", "idiom": "奇貨可居", "definition": "珍異的貨品，可以收藏聚集起來，等候高價出售。後用來比喻依靠某種專長或有利用價值的東西作為資本，來謀取利益。（居：存積、儲存）。"}, {"no": 89, "group": "第 9 組", "idiom": "言簡意賅", "definition": "賅，完備；形容說話或寫文章簡明扼要，但意義卻能包括無遺。與「言近旨遠」、「言淺意深」義近。"}, {"no": 90, "group": "第 9 組", "idiom": "立竿見影", "definition": "比喻功效迅速。"}, {"no": 91, "group": "第 10 組", "idiom": "罄竹難書", "definition": "罄，盡；竹，古代寫書的竹簡；形容罪惡極多，無法細數。"}, {"no": 92, "group": "第 10 組", "idiom": "杞人憂天", "definition": "古時杞國有個人，成天擔心天會塌下來，因而寢食難安。後來用以比喻無謂的憂慮。與「杞天之憂、庸人自擾」相似。"}, {"no": 93, "group": "第 10 組", "idiom": "馬齒徒長", "definition": "馬齒隨著年歲而增多，比喻年齡。徒長用以謙稱自己只是年齡增多，但學問沒有長進，事業無成。"}, {"no": 94, "group": "第 10 組", "idiom": "麻中蓬直", "definition": "飛蓬草生長在麻中，不用扶持也能直立生長。形容好的環境可以對人產生積極的影響。近似「近朱者赤」、「潛移默化」。"}, {"no": 95, "group": "第 10 組", "idiom": "牛角掛書", "definition": "掛書於牛角，且行且讀。形容勤苦向學。"}, {"no": 96, "group": "第 10 組", "idiom": "濫竽充數", "definition": "竽，竹製的簧管樂器；比喻沒有真才實學的人，混在行家裡面充數。"}, {"no": 97, "group": "第 10 組", "idiom": "從善如流", "definition": "表示樂於接受別人正確的意見。與「從善如登」相反。"}, {"no": 98, "group": "第 10 組", "idiom": "囫圇吞棗", "definition": "囫圇，完整的；比喻理解事物或學習時，不細加領悟，只是籠統含糊地接受。"}, {"no": 99, "group": "第 10 組", "idiom": "面面相覷", "definition": "你看我，我看你，相視無言。後用來形容驚懼、詫異而不知所措的樣子。(覷：看。)"}, {"no": 100, "group": "第 10 組", "idiom": "耳濡目染", "definition": "濡，沾染；耳朵常聽，眼睛常看。指無形中受到影響而被同化。"}, {"no": 101, "group": "第 11 組", "idiom": "一傅眾咻", "definition": "傅，教；咻，喧鬧；一個人教，許多人在旁喧鬧擾亂。喻學習環境的重要。"}, {"no": 102, "group": "第 11 組", "idiom": "笑容可掬", "definition": "掬，用兩手捧取。形容笑容滿面的樣子。與「喜形於色、笑逐顏開」相似。"}, {"no": 103, "group": "第 11 組", "idiom": "如雷貫耳", "definition": "好像雷聲傳入耳朵那樣響亮。比喻人名氣很大，眾所共聞。"}, {"no": 104, "group": "第 11 組", "idiom": "望洋興嘆", "definition": "比喻因能力不足而自嘆不如或感到無可奈何。與「無可奈何」義近。"}, {"no": 105, "group": "第 11 組", "idiom": "望其項背", "definition": "項，頸的後部；形容趕得上。「難以望其項背」則形容遠遠落後，比不上別人。"}, {"no": 106, "group": "第 11 組", "idiom": "唾手可得", "definition": "往手上吐唾沫，比喻極容易取得。"}, {"no": 107, "group": "第 11 組", "idiom": "胼手胝足", "definition": "胼、胝，厚繭。手掌腳底因勞動過度，皮膚久受摩擦而產生厚繭。形容極為辛勞。"}, {"no": 108, "group": "第 11 組", "idiom": "倩人捉刀", "definition": "倩，請；捉刀，意指拿筆代寫文章，因為古代以刀削竹簡，而把文字刻在竹簡上。比喻請人代作文章。"}, {"no": 109, "group": "第 11 組", "idiom": "含英咀華", "definition": "品味文章的要旨，咀嚼辭藻的華美。形容文章辭藻華美，值得品味涵詠。亦可用於祝賀人作文比賽獲勝的賀辭。(英、華：指文章、事物精要的部分。)"}, {"no": 110, "group": "第 11 組", "idiom": "暮鼓晨鐘", "definition": "佛寺中敲鐘擊鼓以報時。原表示日子一天一天過去了，今用以比喻使人覺悟的言論；亦作「晨鐘暮鼓」。意近「當頭棒喝ㄏㄜˋ」。"}, {"no": 111, "group": "第 12 組", "idiom": "大放厥詞", "definition": "指發表誇張的言詞。"}, {"no": 112, "group": "第 12 組", "idiom": "邯鄲學步", "definition": "比喻學他人不成，反而失去本來的面目。（典故：壽陵少年學邯鄲人走路，他不但沒有學成，反而連自己原來的步法也忘了，結果只好爬著回去）"}, {"no": 113, "group": "第 12 組", "idiom": "迴腸盪氣", "definition": "形容文章或音樂感人至深，又作「盪氣迴腸」。"}, {"no": 114, "group": "第 12 組", "idiom": "音容宛在", "definition": "人的聲音與容貌彷若在眼前，多用於對死者的弔唁（ㄧㄢˋ）之詞。"}, {"no": 115, "group": "第 12 組", "idiom": "名落孫山", "definition": "指考試或選拔未被錄取。"}, {"no": 116, "group": "第 12 組", "idiom": "老嫗能解", "definition": "嫗，老婦人；形容詩文的淺顯易懂。"}, {"no": 117, "group": "第 12 組", "idiom": "晨昏定省", "definition": "子女侍奉父母的日常儀節。"}, {"no": 118, "group": "第 12 組", "idiom": "撲朔迷離", "definition": "撲朔，雄兔腳毛蓬鬆。迷離，雌兔眼睛瞇縫。撲朔迷離指兔子奔跑時很難辨別雌雄。形容事物錯綜複雜，難以驟然明瞭真相，或用於形容景色迷濛。"}, {"no": 119, "group": "第 12 組", "idiom": "拾人牙慧", "definition": "抄襲別人的語言文字。"}, {"no": 120, "group": "第 12 組", "idiom": "孤掌難鳴", "definition": "一個巴掌難以拍出聲響。比喻人孤立無助，不能成事。與「眾志成城」義反。"}, {"no": 121, "group": "第 13 組", "idiom": "春風化雨", "definition": "老師的教導，如和暖的春風吹拂，如及時的雨水潤化萬物。比喻完善的教化，使人潛移默化。"}, {"no": 122, "group": "第 13 組", "idiom": "不落窠臼", "definition": "比喻不落俗套，有獨創風格。"}, {"no": 123, "group": "第 13 組", "idiom": "拋磚引玉", "definition": "比喻先以自己粗陋的見解或行動來引發別人美好的言論或行為。謙稱自己率先做事。"}, {"no": 124, "group": "第 13 組", "idiom": "渾渾噩噩", "definition": "渾渾，渾厚的樣子；噩噩，嚴正的樣子；句謂人渾樸天真，嚴肅敦厚。今用以形容人糊里糊塗，或對事物無所用心的樣子。"}, {"no": 125, "group": "第 13 組", "idiom": "迎刃而解", "definition": "迎著刀刃的竹子，會順著刀勢裂開。形容相連的事物很容易分解，亦用來比喻事情很容易處理。"}, {"no": 126, "group": "第 13 組", "idiom": "鳳毛麟角", "definition": "鳳凰的羽毛、麒麟的角。比喻稀罕珍貴的人、物。與「吉光片羽」、「屈指可數」、「寥若晨星」義近。"}, {"no": 127, "group": "第 13 組", "idiom": "鞭辟入裡", "definition": "鞭，鞭策；辟，透徹。鞭策剖析到最深層，指做學問自我督策，深入精微研究。後多以之形容言辭或文章說理深刻、透徹。"}, {"no": 128, "group": "第 13 組", "idiom": "擲地有聲", "definition": "形容文辭巧妙華美、說話音韻鏗ㄎㄥ鏘ㄑㄧㄤ有致。"}, {"no": 129, "group": "第 13 組", "idiom": "疊床架屋", "definition": "比喻一切措施，如說話、作文、設施制度等，重複其事，全無創建發明。「屋下架屋」、「床上施床」亦同。"}, {"no": 130, "group": "第 13 組", "idiom": "信口雌黃", "definition": "雌黃，橙黃色礦物，古代用於塗改文字。本指有如口中含著雌黃，能隨時改正不合意的語句。後用「信口雌黃」比喻不顧事實真相，隨口亂說或妄加批評。"}, {"no": 131, "group": "第 14 組", "idiom": "欲蓋彌彰", "definition": "形容想要掩飾過失，反而使過失更加明顯。"}, {"no": 132, "group": "第 14 組", "idiom": "絃歌不輟", "definition": "絃歌，本指用絃樂器伴奏而吟詠，泛指讀書、教學活動或禮樂教化。輟，停止。句謂讀書的聲音不停；比喻（1）講習、教學活動沒有間斷（2）學風很盛。"}, {"no": 133, "group": "第 14 組", "idiom": "不脛而走", "definition": "脛，小腿。「不脛而走」指沒有腿也能去。比喻事物不用推廣，也能迅速傳播。"}, {"no": 134, "group": "第 14 組", "idiom": "黔驢技窮", "definition": "比喻人拙劣的技能已經使完，而終至露出無能的本質。"}, {"no": 135, "group": "第 14 組", "idiom": "生靈塗炭", "definition": "生靈，百姓；塗，泥濘；炭，炭火。塗炭指像陷入水深火熱之中，處境痛苦。形容老百姓的處境極為艱難痛苦。"}, {"no": 136, "group": "第 14 組", "idiom": "風行草偃", "definition": "行，移動；偃，倒伏；風一吹過，草就倒伏。形容執政者以德化民，收效快速。"}, {"no": 137, "group": "第 14 組", "idiom": "沐猴而冠", "definition": "沐猴，獼猴。「沐猴而冠」指性情急躁的獼猴學人穿戴冠帽。比喻人虛有表象，卻不脫粗鄙的本質。"}, {"no": 138, "group": "第 14 組", "idiom": "摩頂放踵", "definition": "摩，磨損；放，至；踵，腳跟。句意：從頭到腳都磨破皮。形容一個人具有熱心救世的熱誠，為了眾人奔波勞苦。"}, {"no": 139, "group": "第 14 組", "idiom": "模稜兩可", "definition": "摸物稜角兩端，摸那一端都可以。比喻處理事情的態度含混，不表示明確的意見或主張。"}, {"no": 140, "group": "第 14 組", "idiom": "芒刺在背", "definition": "像是有許多細小的芒刺沾在背上，令人坐立難安。比喻因畏忌而極度不安。與「如坐針氈」義近。"}, {"no": 141, "group": "第 15 組", "idiom": "三人成虎", "definition": "比喻謠言或不實的傳聞經過多人散播，就會使人信以為真。"}, {"no": 142, "group": "第 15 組", "idiom": "指桑罵槐", "definition": "指著桑樹罵槐樹，比喻拐彎抹角的罵人。"}, {"no": 143, "group": "第 15 組", "idiom": "舐犢情深", "definition": "舐，舔ㄊㄧㄢˇ；犢，小牛；比喻父母疼愛子女的深情。"}, {"no": 144, "group": "第 15 組", "idiom": "慎終追遠", "definition": "謹慎處理父母的喪事，虔誠的追念祖先。指人不忘本，是重視孝道的用語。"}, {"no": 145, "group": "第 15 組", "idiom": "韜光養晦", "definition": "韜，隱藏；晦，昏暗。比喻把聲名或才華隱藏起來不外露。"}, {"no": 146, "group": "第 15 組", "idiom": "毛遂自薦", "definition": "毛遂，戰國趙人，為平原君食客。比喻自我推薦。"}, {"no": 147, "group": "第 15 組", "idiom": "斷章取義", "definition": "原意是取詩經的某一章來表達自己的心意。後來指：引用別人的文章或談話的片斷，而不顧及全篇內容與意思。"}, {"no": 148, "group": "第 15 組", "idiom": "戰戰兢兢", "definition": "戰戰，害怕的樣子；兢兢，小心謹慎的樣子。形容做事時戒慎惶恐的态度。與「兢兢業業」（註：業業，警惕小心的樣子 ）類似。"}, {"no": 149, "group": "第 15 組", "idiom": "望塵莫及", "definition": "及，達到；只見塵土飛揚而無法再趕上，指遠遠落於人後。"}, {"no": 150, "group": "第 15 組", "idiom": "並駕齊驅", "definition": "本指車駕並行，馬匹並排一齊奔跑。比喻彼此能力或地位，彼此相等。"}, {"no": 151, "group": "第 16 組", "idiom": "東施效顰", "definition": "效，仿效；顰，皺眉。比喻不知別人長處何在，胡亂模仿，結果適得其反。「邯鄲學步」、「畫虎類犬」義同。"}, {"no": 152, "group": "第 16 組", "idiom": "刮目相看", "definition": "又作「另眼相看」、「另眼相待」。指對方已不同往日或較別人特殊而給予與眾不同的對待。"}, {"no": 153, "group": "第 16 組", "idiom": "退避三舍", "definition": "本指作戰時，退兵九十里以表退讓，後引申為對別人忍讓，不敢相爭的意思。（三舍，古時行軍三十里為一舍，三舍為九十里）"}, {"no": 154, "group": "第 16 組", "idiom": "剛愎自用", "definition": "愎，固執己見；自用，自以為是。固執己見，專斷獨行。意同「師心自用」、「一意孤行」、「獨斷專行」。"}, {"no": 155, "group": "第 16 組", "idiom": "咎由自取", "definition": "咎，罪過；罪過、災禍是自己招來的。"}, {"no": 156, "group": "第 16 組", "idiom": "無遠弗屆", "definition": "屆，到的意思；指沒有不能到達的地方。"}, {"no": 157, "group": "第 16 組", "idiom": "千鈞一髮", "definition": "以一根頭髮懸吊千鈞重物，比喻情況非常危急。（鈞，古代重量單位，三十斤）"}, {"no": 158, "group": "第 16 組", "idiom": "破鏡重圓", "definition": "比喻「夫妻」離散後又再復合。"}, {"no": 159, "group": "第 16 組", "idiom": "破釜沉舟", "definition": "釜，鍋；比喻下定決心 ，只以一次機會就達到成功的目標，絕不留後路。"}, {"no": 160, "group": "第 16 組", "idiom": "韋編三絕", "definition": "韋，熟牛皮，古時用竹簡寫字，竹簡用牛皮帶編聯起來；三絕，指多次斷絕。用以形容讀書刻苦勤奮。"}, {"no": 161, "group": "第 17 組", "idiom": "信誓旦旦", "definition": "旦旦，誠懇的樣子，指誓言說得極為誠懇可信。"}, {"no": 162, "group": "第 17 組", "idiom": "撥雲見日", "definition": "比喻事態轉為明朗或形容境遇由壞轉好。意同「否ㄆㄧˇ極泰來」、「時來運轉」。"}, {"no": 163, "group": "第 17 組", "idiom": "中流砥柱", "definition": "中流，指黃河中游；砥柱，屹立於黃河中游之山。形容人在艱難動盪的環境中能擔當大任。"}, {"no": 164, "group": "第 17 組", "idiom": "車水馬龍", "definition": "車像流水，馬像長龍一樣往來不絕。形容車馬往來不絕的繁華熱鬧。與「川流不息」、「熙ㄒㄧ來攘ㄖㄤˇ往」、「絡ㄌㄨㄛˋ繹ㄧˋ不絕」義近。（川流不息：像河裡的水流一樣連續不斷，比喻來往行人、車馬很多。）"}, {"no": 165, "group": "第 17 組", "idiom": "維妙維肖", "definition": "維，文言語助詞；妙，美、好；肖，像、逼真。形容描寫或模仿極為逼真。"}, {"no": 166, "group": "第 17 組", "idiom": "滄海桑田", "definition": "大海變為桑田，桑田變為滄海。比喻世事變化很大。也作「滄海揚塵」、「東海揚塵」（註：海面揚塵，已經變為陸地的景象）"}, {"no": 167, "group": "第 17 組", "idiom": "滄海一粟", "definition": "粟，小米；比喻人在天地間，如大海中的一粒小米粒，極其渺小。※比較「曇花（華）一現」：曇花開放幾個小時就凋謝了，形容事物出現不久就消逝，極為短暫。"}, {"no": 168, "group": "第 17 組", "idiom": "年高德劭", "definition": "劭，美好。形容人年紀大而德行優美，受人尊敬。「德高望重」、「齒德俱尊」（註：齒，指年齡）義近。"}, {"no": 169, "group": "第 17 組", "idiom": "管鮑之交", "definition": "春秋齊國管仲和鮑叔牙相知最深。比喻交情深厚。"}, {"no": 170, "group": "第 17 組", "idiom": "既往不咎", "definition": "既，已經；咎，怪罪。形容對已經過去的錯事，不再追究責備。"}, {"no": 171, "group": "第 18 組", "idiom": "捕風捉影", "definition": "比喻所做之事或所說的話毫無根據，憑空揣測。"}, {"no": 172, "group": "第 18 組", "idiom": "相形見絀", "definition": "相形，比較；絀，不足。表示兩相比較，顯出其中一方的拙劣。也用作謙詞。"}, {"no": 173, "group": "第 18 組", "idiom": "人謀不臧", "definition": "謀，謀畫；臧，善、好；句謂人的謀畫不妥善。常用以說明事情失敗的原因，是人為所導致，與天命毫無關係。"}, {"no": 174, "group": "第 18 組", "idiom": "叱吒風雲", "definition": "叱吒，怒喝ㄏㄜˋ。一聲怒喝就能使風雲變色。形容人聲勢威力極大，能左右世局。"}, {"no": 175, "group": "第 18 組", "idiom": "物換星移", "definition": "景物變換，星辰位置移動；形容時序的變遷，人事的變化。"}, {"no": 176, "group": "第 18 組", "idiom": "二八年華", "definition": "二八，即十六歲。用以形容少女正當青春美麗的時期。"}, {"no": 177, "group": "第 18 組", "idiom": "大家風範", "definition": "大家，舊指有聲望地位的人家；風範，風度、氣派。意指有地位或有學識之人的特有氣度。《三俠五義˙第十八回》：『獻茶已畢，敘起話來，問答如流，氣度從容，真是大家風範，把個狄后樂了個不得。』」"}, {"no": 178, "group": "第 18 組", "idiom": "膾炙人口", "definition": "膾，切細的肉；炙，烤肉；二者是人人喜愛的美味。句指詩文或事物被眾人所喜愛而流傳。"}, {"no": 179, "group": "第 18 組", "idiom": "道貌岸然", "definition": "神態莊嚴，一副道學家的樣子，與「嬉皮笑臉」相反；常含有譏諷的意味，指一個人表面上故作嚴肅，事實上表裡不一。（岸然，高傲威嚴的樣子）"}, {"no": 180, "group": "第 18 組", "idiom": "夜不閉戶", "definition": "夜間睡覺不用關門，形容社會秩序良好安定，盜賊絕跡。同「路不拾遺」。"}, {"no": 181, "group": "第 19 組", "idiom": "梨園子弟", "definition": "梨園，原指唐玄宗教練歌舞藝人的地方。 後泛稱戲班為梨園；戲劇演員為「梨園子弟」或「梨園弟子」。"}, {"no": 182, "group": "第 19 組", "idiom": "匹夫之勇", "definition": "匹夫，一個人，泛指普通人；形容沒有智謀，僅憑個人蠻幹的勇敢。"}, {"no": 183, "group": "第 19 組", "idiom": "嘔心瀝血", "definition": "瀝，滴下。形容用盡心思腦力。"}, {"no": 184, "group": "第 19 組", "idiom": "草菅人命", "definition": "菅，一種野草；句謂把人命看做野草。指為政者漠視人命，任意殘害。"}, {"no": 185, "group": "第 19 組", "idiom": "同舟共濟", "definition": "濟，渡河。大家同坐一條船渡河，比喻利害一致、患難與共。與「風雨同舟」、「和衷共濟」、「同心協力」義近。"}, {"no": 186, "group": "第 19 組", "idiom": "瞠目結舌", "definition": "瞪大眼睛看而說不出話來，形容受窘或驚呆的樣子。"}, {"no": 187, "group": "第 19 組", "idiom": "燃眉之急", "definition": "像火燒眉毛般緊迫。形容事態嚴重，情況危急。義近「迫不及待」、「迫在眉睫」、「當務之急」、「急如星火」、「十萬火急」、「刻不容緩」。"}, {"no": 188, "group": "第 19 組", "idiom": "杯弓蛇影", "definition": "酒杯中映出弓的影子，像是有一條蛇。比喻因無中生有的疑慮自相驚擾不已。「草木皆兵」（註：把山上的草木都當作敵兵，形容極度驚恐時，疑神疑鬼的心理）義近。"}, {"no": 189, "group": "第 19 組", "idiom": "錙銖必較", "definition": "錙銖，古代重量單位；六銖為一錙，四錙為一兩；指極小的份量。用以形容對細微的事物或很少的錢財都要計較。同「斤斤計較」。"}, {"no": 190, "group": "第 19 組", "idiom": "談笑風生", "definition": "風生，風趣四溢；句謂談話時有說有笑，興致極高而風趣。"}, {"no": 191, "group": "第 20 組", "idiom": "妄自菲薄", "definition": "妄，沒根據、不實際，或做任意、輕率解。菲薄，動詞，輕視；句謂輕率地鄙視自己，形容人自輕自賤，過份地小看自己。"}, {"no": 192, "group": "第 20 組", "idiom": "古道熱腸", "definition": "古道，指古代敦厚純樸的道德風尚，不似今人薄情貪利。熱腸，熱心腸。形容待人厚道，真摯熱情；讚美有救助別人的美德。"}, {"no": 193, "group": "第 20 組", "idiom": "病入膏肓", "definition": "古代醫家指心尖脂肪為膏，心臟和隔膜之間為肓，認為膏肓之間為藥力所不能達到之處。句指病重到了無法醫治的地步；也比喻事態嚴重到無法挽回的程度。同「藥石無功」、「無可救藥」、「沈痾難起」（痾ㄜ，病）。"}, {"no": 194, "group": "第 20 組", "idiom": "野人獻曝", "definition": "野人，鄉野鄙夫，一般指農夫；曝，曬太陽。指平凡人所能貢獻的平凡事物，常用作提出建議時的自謙之詞，比喻所見雖然淺陋，而貢獻出於真心。"}, {"no": 195, "group": "第 20 組", "idiom": "鬼斧神工", "definition": "形容大自然景物之美妙，或藝術品之技藝精巧，已達神仙才能做到的境界，非人力所能及。"}, {"no": 196, "group": "第 20 組", "idiom": "循循善誘", "definition": "善於循序漸進的誘導別人。"}, {"no": 197, "group": "第 20 組", "idiom": "義憤填膺", "definition": "膺，胸膛；表示一個人為正義之不伸而激起的憤慨，充滿胸中。"}, {"no": 198, "group": "第 20 組", "idiom": "進退維谷", "definition": "形容前進後退都無路可走的困窘處境。意同「進退兩難」"}, {"no": 199, "group": "第 20 組", "idiom": "買櫝還珠", "definition": "買了裝珍珠的盒子，而把珍珠退還。後用「買櫝還珠」比喻捨本逐末，取捨失當。"}, {"no": 200, "group": "第 20 組", "idiom": "門可羅雀", "definition": "門前冷清，空曠得可張網捕雀。形容做官的人失勢後賓客稀少的景況。"}]; const DISTRACTOR=["案", "按", "岸", "暗", "部", "步", "布", "簿", "就", "舊", "救", "究", "班", "斑", "般", "板", "河", "何", "和", "合", "若", "弱", "偌", "懸", "玄", "旋", "選", "探", "嘆", "炭", "談", "囊", "狼", "郎", "朗", "取", "娶", "曲", "去", "物", "務", "悟", "誤", "守", "首", "手", "受", "株", "珠", "朱", "諸", "待", "代", "帶", "戴", "兔", "吐", "圖", "途", "明", "名", "鳴", "銘", "察", "查", "茶", "差", "秋", "丘", "邱", "球", "毫", "豪", "號", "桃", "逃", "陶", "淘", "報", "抱", "暴", "爆", "李", "理", "里", "禮", "防", "房", "訪", "仿", "微", "威", "危", "薇", "杜", "度", "渡", "肚", "漸", "建", "見", "箭", "宜", "儀", "疑", "移", "室", "事", "式", "世", "家", "加", "佳", "嘉", "謙", "千", "牽", "遷", "沖", "充", "衝", "蟲", "自", "字", "子", "紫", "牧", "木", "目", "穆", "言", "岩", "延", "研", "九", "久", "酒", "玖", "鼎", "頂", "定", "訂", "鴻", "宏", "洪", "紅", "鵠", "湖", "胡", "壺", "志", "至", "治", "智", "投", "頭", "偷", "透", "口", "扣", "叩", "寇"];

function today(){let d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function getDate(){return localStorage.getItem('idiomTestDate')||today()}
function setDate(v){localStorage.setItem('idiomTestDate',v||today())}
function records(){try{return JSON.parse(localStorage.getItem('idiomRecords')||'[]')}catch(e){return []}}
function putRecords(r){localStorage.setItem('idiomRecords',JSON.stringify(r))}
function mastery(){try{return JSON.parse(localStorage.getItem('idiomMastery')||'{}')}catch(e){return {}}}
function putMastery(m){localStorage.setItem('idiomMastery',JSON.stringify(m))}
function unlocked(){return Math.max(1,Number(localStorage.getItem('idiomUnlocked')||1))}
function stageName(n){return n===1?'四選一':n===2?'連連看':'5×5 解謎'}
function beginSession(g){session={id:Date.now(),date:getDate(),group:g+1,started:new Date().toISOString(),finished:null,attempts:0,wrong:{},completed:false}}
function logWrong(item,stage,wrongChoice){if(!session)return;state.attempts++;session.attempts++;let k=item.no;let w=session.wrong[k]||(session.wrong[k]={no:item.no,idiom:item.idiom,definition:item.definition,count:0,stages:[],choices:[]});w.count++;if(!w.stages.includes(stageName(stage)))w.stages.push(stageName(stage));if(wrongChoice&&!w.choices.includes(wrongChoice))w.choices.push(wrongChoice);let m=mastery();m[k]={status:'pending',lastWrong:session.date};putMastery(m)}
function saveSession(completed=false){if(!session)return;session.completed=completed;if(completed)session.finished=new Date().toISOString();let r=records();let i=r.findIndex(x=>x.id===session.id);if(i>=0)r[i]=session;else r.push(session);putRecords(r)}
function activeWrong(){let r=records(),m=mastery(),map={};r.forEach(s=>Object.values(s.wrong||{}).forEach(w=>{let x=map[w.no]||(map[w.no]={...w,total:0,lastDate:s.date});x.total+=w.count;x.lastDate=s.date}));return Object.values(map).filter(w=>(m[w.no]?.status||'pending')!=='mastered').sort((a,b)=>b.total-a.total)}
function home(){state={group:0,stage:1,sub:0,q:0,score:0,attempts:0};session=null;$('#headerInfo').textContent='200 題・20 組';let u=unlocked(),aw=activeWrong();main.innerHTML=`<section class="card home"><h1>成語闖關王</h1><p class="lead">每組 10 個成語，依序挑戰三階段：<b>① 釋義四選一　② 釋義連連看　③ 5×5 成語解謎</b>。</p><div class="datebox"><b>📅 測驗日期</b><input id="testDate" type="date" value="${getDate()}"><span class="tiny">本次闖關將使用此日期記錄</span></div><div class="home-actions"><button class="bigbtn" id="reviewBtn">錯題複習 <span class="tag">${aw.length} 題</span></button><button class="bigbtn secondary" id="teacherBtn">老師查看學習紀錄</button></div><div class="group-grid">${byGroup.map((g,i)=>`<button class="group-btn ${i+1<u?'done':''} ${i+1===u?'current':''}" data-g="${i+1}" ${i+1>u?'disabled':''}>第 ${i+1} 組<br><span class="tiny">${i+1>u?'🔒 尚未解鎖':i+1<u?'✓ 已完成':'▶ 開始挑戰'}</span></button>`).join('')}</div><p class="tiny" style="margin-top:18px">測驗日期、錯題與學習紀錄只儲存在這台 iPad 的 Safari。清除網站資料會同時清除紀錄。</p></section>`;$('#testDate').onchange=e=>setDate(e.target.value);document.querySelectorAll('.group-btn:not([disabled])').forEach(b=>b.onclick=()=>startGroup(+b.dataset.g-1));$('#reviewBtn').onclick=startReview;$('#teacherBtn').onclick=teacherView}
function startGroup(g){state={group:g,stage:1,sub:0,q:0,score:0,attempts:0};beginSession(g);startMC()}
function shell(title,instr,body,pct){$('#headerInfo').textContent=`${session?.date||getDate()}・第 ${state.group+1} 組`;main.innerHTML=`<section class="card"><div class="topline"><div><span class="stage-badge">${title}</span></div><button class="bigbtn secondary" id="homeBtn">回選單</button></div><div class="progress"><div style="width:${pct}%"></div></div><p class="instruction">${instr}</p>${body}</section>`;$('#homeBtn').onclick=()=>{saveSession(false);home()}}
function startMatch(){state.stage=2;state.sub=0;matched=new Set();selected=null;renderMatch()}
function matchScreen(set,title,instr,pct,next){let defs=shuffle(set);shell(title,instr,`<div class="match-wrap"><div class="match-col">${set.map(x=>`<button class="match-btn idiom ${matched.has(x.no)?'matched':''}" data-i="${x.no}">${x.idiom}</button>`).join('')}</div><div class="match-col">${defs.map(x=>`<button class="match-btn ${matched.has(x.no)?'matched':''}" data-d="${x.no}">${x.definition}</button>`).join('')}</div></div><div class="feedback" id="fb"></div>`,pct);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(matched.has(+b.dataset.i))return;document.querySelectorAll('[data-i]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=+b.dataset.i});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!selected||matched.has(+b.dataset.d))return;let item=set.find(x=>x.no===selected);if(+b.dataset.d===selected){matched.add(selected);selected=null;if(matched.size===5)setTimeout(next,400);else matchScreen(set,title,instr,pct,next)}else{let wrong=set.find(x=>x.no===+b.dataset.d);logWrong(item,2,wrong?.definition||'錯誤釋義');$('#fb').innerHTML='<span class="badtext">配對不正確，再試一次。</span>';b.classList.add('wrong')}})}
function renderMatch(){let set=byGroup[state.group].slice(0,5);matchScreen(set,'第二階段｜成語釋義連連看','先點左邊的成語，再點右邊相符的釋義。全部配對成功後，還有第二盤。',15,()=>{state.sub=1;matched=new Set();renderMatch2()})}
function renderMatch2(){let set=byGroup[state.group].slice(5,10);matchScreen(set,'第二階段｜連連看・第二盤','完成這 5 組配對，就能進入成語解謎。',60,()=>startPuzzle(0))}
function startMC(){state.stage=1;state.q=0;mcLocked=false;renderMC()}
function renderMC(){let target=byGroup[state.group][state.q];let others=byGroup[state.group].filter(x=>x.no!==target.no);let opts=shuffle([target,...shuffle(others).slice(0,3)]);shell('第一階段｜成語釋義四選一',`第 ${state.q+1} / 10 題　讀懂釋義後，選出最符合的成語。`,`<div class="definition">${target.definition}</div><div class="options">${opts.map(x=>`<button class="option" data-no="${x.no}">${x.idiom}</button>`).join('')}</div><div class="feedback" id="fb"></div>`,(state.q/10)*30);document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(mcLocked)return;let picked=BANK.find(x=>x.no===+b.dataset.no);if(+b.dataset.no===target.no){mcLocked=true;b.classList.add('correct');$('#fb').innerHTML='<span class="ok">答對了！</span>';state.score++;setTimeout(()=>{state.q++;mcLocked=false;if(state.q>=10)startMatch();else renderMC()},500)}else{logWrong(target,1,picked?.idiom);b.classList.add('wrong');$('#fb').innerHTML='<span class="badtext">不是這個成語，再讀一次釋義。</span>';setTimeout(()=>b.classList.remove('wrong'),400)}})}
function similarChar(ch,used){let idx=DISTRACTOR.indexOf(ch);if(idx>=0){for(let d=1;d<8;d++){for(let k of [idx-d,idx+d])if(k>=0&&k<DISTRACTOR.length&&!used.has(DISTRACTOR[k]))return DISTRACTOR[k]}}let candidates=shuffle(DISTRACTOR.filter(x=>!used.has(x)));return candidates[0]||'學'}
function makePuzzle(sub){let set=byGroup[state.group].slice(sub*5,sub*5+5),answerChars=set.flatMap(x=>[...x.idiom]),used=new Set(answerChars),fillers=[];for(let x of set){let c=similarChar([...x.idiom][Math.floor(Math.random()*4)],used);fillers.push(c);used.add(c)}let cells=shuffle([...answerChars,...fillers]).map((ch,i)=>({ch,i,solved:false}));return {set,order:shuffle(set),cells,q:0,picks:[],solved:new Set()}}
function startPuzzle(sub){state.stage=3;state.sub=sub;puzzle=makePuzzle(sub);renderPuzzle()}
function renderPuzzle(){let t=puzzle.order[puzzle.q];shell(`第三階段｜5×5 成語解謎 ${state.sub===0?'A':'B'}`,`第 ${puzzle.q+1} / 5 題　依照釋義，按正確順序點出四個字。`,`<div class="definition">${t.definition}</div><div class="answerline">${puzzle.picks.map(i=>puzzle.cells[i].ch).join('　')||'＿　＿　＿　＿'}</div><div class="grid5">${puzzle.cells.map((c,i)=>`<button class="tile ${puzzle.picks.includes(i)?'sel':''} ${c.solved?'solved':''}" data-cell="${i}">${c.ch}</button>`).join('')}</div><div class="feedback" id="fb"></div>`,60+(state.sub*20)+(puzzle.q/5)*20);document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>pickCell(+b.dataset.cell))}
function pickCell(i){let t=puzzle.order[puzzle.q],expected=[...t.idiom][puzzle.picks.length];if(puzzle.cells[i].ch===expected&&!puzzle.picks.includes(i)){puzzle.picks.push(i);if(puzzle.picks.length===4){let word=puzzle.picks.map(j=>puzzle.cells[j].ch).join('');if(word===t.idiom){puzzle.picks.forEach(j=>puzzle.cells[j].solved=true);puzzle.solved.add(t.no);state.score++;$('#fb').innerHTML=`<span class="ok">破解成功：${t.idiom}</span>`;setTimeout(()=>{puzzle.q++;puzzle.picks=[];if(puzzle.q>=5){if(state.sub===0)startPuzzle(1);else finishGroup()}else renderPuzzle()},650)}}else renderPuzzle()}else{logWrong(t,3,puzzle.cells[i].ch);let b=document.querySelector(`[data-cell="${i}"]`);b.classList.add('bad');$('#fb').innerHTML='<span class="badtext">順序或字不對，再找找看。</span>';setTimeout(()=>b.classList.remove('bad'),300)}}
function finishGroup(){let next=state.group+2;localStorage.setItem('idiomUnlocked',String(Math.min(20,Math.max(unlocked(),next))));saveSession(true);let stars=state.attempts<=3?'★★★':state.attempts<=8?'★★☆':'★☆☆',wc=Object.keys(session.wrong).length;modal.classList.remove('hidden');$('#modalCard').innerHTML=`<div class="stars">${stars}</div><h2>第 ${state.group+1} 組闖關成功！</h2><p>測驗日期：<b>${session.date}</b></p><p>本組錯誤／重試 ${state.attempts} 次，共涉及 <b>${wc}</b> 個成語。</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="bigbtn" id="nextBtn">${state.group<19?'挑戰下一組':'全部完成'}</button>${wc?'<button class="bigbtn secondary" id="reviewNow">複習錯題</button>':''}<button class="bigbtn secondary" id="menuBtn">回選單</button></div>`;$('#menuBtn').onclick=()=>{modal.classList.add('hidden');home()};$('#nextBtn').onclick=()=>{modal.classList.add('hidden');if(state.group<19)startGroup(state.group+1);else home()};if(wc)$('#reviewNow').onclick=()=>{modal.classList.add('hidden');startReview(Object.keys(session.wrong).map(Number))}}
function startReview(ids=null){let wrong=activeWrong();if(ids)wrong=wrong.filter(w=>ids.includes(+w.no));if(!wrong.length){modal.classList.remove('hidden');$('#modalCard').innerHTML='<h2>目前沒有待複習錯題</h2><p>已經沒有尚未掌握的錯題。</p><button class="bigbtn" id="closeM">回選單</button>';$('#closeM').onclick=()=>{modal.classList.add('hidden');home()};return}review={items:shuffle(wrong),q:0,correct:0};renderReview()}
function renderReview(){let w=review.items[review.q],target=BANK.find(x=>x.no===+w.no),pool=BANK.filter(x=>x.no!==target.no&&x.group===target.group),opts=shuffle([target,...shuffle(pool).slice(0,3)]);$('#headerInfo').textContent=`錯題複習 ${review.q+1}/${review.items.length}`;main.innerHTML=`<section class="card"><div class="topline"><span class="stage-badge">錯題複習模式</span><button class="bigbtn secondary" id="homeBtn">回選單</button></div><div class="progress"><div style="width:${(review.q/review.items.length)*100}%"></div></div><p class="instruction">曾錯 ${w.total} 次。請重新判斷正確成語；本次答對後會標記為「已掌握」。</p><div class="definition">${target.definition}</div><div class="options">${opts.map(x=>`<button class="option" data-no="${x.no}">${x.idiom}</button>`).join('')}</div><div class="feedback" id="fb"></div></section>`;$('#homeBtn').onclick=home;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(+b.dataset.no===target.no){b.classList.add('correct');let m=mastery();m[target.no]={status:'mastered',masteredDate:today(),lastWrong:m[target.no]?.lastWrong};putMastery(m);review.correct++;$('#fb').innerHTML='<span class="ok">答對了，已標記為掌握！</span>';setTimeout(()=>{review.q++;if(review.q>=review.items.length)finishReview();else renderReview()},650)}else{b.classList.add('wrong');$('#fb').innerHTML='<span class="badtext">再讀一次釋義後重試。</span>';setTimeout(()=>b.classList.remove('wrong'),400)}})}
function finishReview(){modal.classList.remove('hidden');$('#modalCard').innerHTML=`<h2>錯題複習完成</h2><p>本次複習 ${review.items.length} 題，已重新答對 ${review.correct} 題。</p><button class="bigbtn" id="closeM">回選單</button>`;$('#closeM').onclick=()=>{modal.classList.add('hidden');home()}}
function teacherView(){let r=records(),aw=activeWrong(),m=mastery(),completed=r.filter(x=>x.completed).length,totalWrong=r.reduce((a,s)=>a+(s.attempts||0),0);$('#headerInfo').textContent='老師模式';let rows=[...r].reverse().map(s=>`<tr><td>${esc(s.date)}</td><td>第 ${s.group} 組</td><td>${s.completed?'完成':'中途離開'}</td><td>${s.attempts||0}</td><td>${Object.values(s.wrong||{}).map(w=>esc(w.idiom)).join('、')||'—'}</td></tr>`).join('');main.innerHTML=`<section class="card"><div class="topline"><div><h2 style="margin:0">老師查看學習紀錄</h2></div><button class="bigbtn secondary" id="homeBtn">回選單</button></div><div class="teacher-summary"><div class="stat">測驗紀錄<b>${r.length}</b></div><div class="stat">完成關卡<b>${completed}</b></div><div class="stat">累計錯誤／重試<b>${totalWrong}</b></div><div class="stat">待複習成語<b>${aw.length}</b></div></div><h3>待複習錯題</h3>${aw.length?`<div class="wrong-list">${aw.map(w=>`<div class="wrong-item"><b>${esc(w.idiom)}</b> <span class="tag badtag">累計 ${w.total} 次</span><span class="tag">最近 ${esc(w.lastDate)}</span><br><span class="tiny">${esc(w.definition)}</span></div>`).join('')}</div><button class="bigbtn" id="reviewAll">開始錯題複習</button>`:'<p class="ok">目前沒有待複習錯題。</p>'}<h3 style="margin-top:24px">歷次測驗</h3><div class="table-wrap"><table class="record-table"><thead><tr><th>日期</th><th>組別</th><th>狀態</th><th>錯誤次數</th><th>曾錯成語</th></tr></thead><tbody>${rows||'<tr><td colspan="5">尚無測驗紀錄</td></tr>'}</tbody></table></div><div class="home-actions"><button class="bigbtn secondary" id="exportBtn">匯出 CSV 紀錄</button><button class="bigbtn danger" id="clearBtn">清除學習紀錄</button></div><p class="tiny">「已掌握」只影響待複習清單，歷史測驗中的錯誤仍永久保留，方便追蹤學習歷程。</p></section>`;$('#homeBtn').onclick=home;if($('#reviewAll'))$('#reviewAll').onclick=startReview;$('#exportBtn').onclick=exportCSV;$('#clearBtn').onclick=()=>{if(confirm('確定要清除所有測驗日期、錯題與學習紀錄嗎？已解鎖關卡不會被清除。')){localStorage.removeItem('idiomRecords');localStorage.removeItem('idiomMastery');teacherView()}}}
function exportCSV(){let r=records(),lines=[['測驗日期','組別','狀態','錯誤重試次數','錯題成語','錯誤階段','錯選內容']];r.forEach(s=>{let ws=Object.values(s.wrong||{});if(!ws.length)lines.push([s.date,s.group,s.completed?'完成':'中途離開',s.attempts,'','','']);else ws.forEach(w=>lines.push([s.date,s.group,s.completed?'完成':'中途離開',w.count,w.idiom,w.stages.join('/'),w.choices.join('/')]))});let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`成語學習紀錄_${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
home();
</script></body></html>
